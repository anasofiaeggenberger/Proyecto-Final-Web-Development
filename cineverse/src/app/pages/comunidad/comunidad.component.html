<div class="community-container">
  <h2 class="title">🍿 Comunidad <span>CineVerse</span></h2>
  <p class="subtitle">
    Comparte tus opiniones, teorías o listas de tus películas favoritas.
  </p>

  <textarea
    [(ngModel)]="newPost"
    placeholder="Escribe tu publicación aquí..."
    rows="3"
  ></textarea>

  <button (click)="publish()" [disabled]="loading" class="publish-btn">
    {{ loading ? 'Publicando...' : 'Publicar' }}
  </button>

  <div class="posts">
    <div *ngIf="posts.length === 0" class="empty">
      Aún no hay publicaciones. ¡Sé el primero en escribir algo!
    </div>

    <div *ngFor="let post of posts" class="post-card">
      <p class="content">{{ post.content }}</p>
      <p class="author">👤 {{ post.userEmail }}</p>
      <p class="date">{{ post.createdAt | date:'short' }}</p>
    </div>
  </div>
</div>
