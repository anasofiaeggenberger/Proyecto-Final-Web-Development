<div class="login-page">
  <div class="login-card">
    <h2 class="login-title">Bienvenido a <span>CineVerse</span></h2>
    <p class="login-subtitle">Inicia sesión para continuar</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="usuario@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="********">
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <p class="register-text">
      ¿No tienes cuenta?
      <a routerLink="/auth/register">Crea una aquí</a>
    </p>
  </div>
</div>
