<section class="hero">
  <!-- 🎥 Video de fondo real -->
  <video autoplay muted loop playsinline preload="auto" class="hero-video">
    <source src="assets/cineverse-bg.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <div class="hero-content">
    <h1 class="hero-title">Donde tus emociones y películas se conectan</h1>
    <p class="hero-subtitle">
      Sumérgete en un universo cinematográfico diseñado para ti.  
      Explora historias que reflejan tu estado de ánimo.
    </p>
    <button class="explore-btn">Explorar ahora</button>
  </div>
</section>

<!-- MOODS -->
<section class="moods" [ngClass]="getMoodClass()">
  <h2 class="moods-title">¿Cómo te sientes hoy?</h2>

  <div class="mood-container">
    <div
      class="mood-card"
      *ngFor="let mood of moods"
      [ngStyle]="{ '--accent': mood.color }"
      (click)="selectMood(mood.name)"
    >
      <div class="icon-wrapper">
        <i [class]="mood.icon"></i>
      </div>
      <p>{{ mood.label }}</p>
    </div>
  </div>
</section>
