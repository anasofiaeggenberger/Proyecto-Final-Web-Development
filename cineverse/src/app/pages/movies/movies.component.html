<section class="movies">
    <h2>🎬 Descubre películas según tu estado de ánimo</h2>
    <p>
      Explora historias que se adaptan a cómo te sientes hoy — acción para tus días energéticos,
      romance para los soñadores, y drama cuando necesitas reflexionar.
    </p>
  
    <div class="movie-grid">
      <div class="movie-card" *ngFor="let movie of movies">
        <img [src]="movie.image" [alt]="movie.title" />
        <h4>{{ movie.title }}</h4>
        <p>{{ movie.description }}</p>
      </div>
    </div>
  </section>
