<section class="movies-page">

  <!-- 🎭 SECCIÓN DE RECOMENDADAS (arriba) -->
  <div *ngIf="recommendedMovies.length > 0" class="recommended-section">
    <h2 class="section-title">
      🎭 Recomendadas según tu mood:
      <span class="highlight">{{ selectedMood | titlecase }}</span>
    </h2>

    <div class="movies-grid">
      <div *ngFor="let movie of recommendedMovies" class="movie-card" (click)="openMovie(movie.id)">
        <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" [alt]="movie.title" />
        <p>{{ movie.title }}</p>
      </div>
    </div>
  </div>

  <!-- 🍿 SECCIÓN DE POPULARES (abajo) -->
  <h2 class="section-title">🍿 Películas Populares</h2>

  <div class="movies-grid">
    <div *ngFor="let movie of popularMovies" class="movie-card" (click)="openMovie(movie.id)">
      <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" [alt]="movie.title" />
      <p>{{ movie.title }}</p>
    </div>
  </div>

  <button (click)="loadMoreMovies()" class="load-btn" *ngIf="!loading">Cargar más</button>
  <p *ngIf="loading">Cargando...</p>

</section>
